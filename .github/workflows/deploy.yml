name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # Phase 1: Code Quality & Dependency Validation
  # ========================================================
  validate:
    name: Code & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r talkio/requirements.txt
          pip install flake8

      - name: Python Syntax & Lint Check
        run: |
          # Stop build on fatal syntax errors
          flake8 talkio/backend --count --select=E9,F63,F7,F82 --show-source --statistics

  # ========================================================
  # Phase 2: Native OpenSSH Automated Deployment
  # ========================================================
  deploy:
    name: Deploy to Production VPS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Native SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME || 'deploy' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
        run: |
          echo "🔍 Checking Deployment Secrets..."
          
          # Diagnostic validation with clear error messages
          if [ -z "$VPS_HOST" ]; then
            echo "❌ CRITICAL ERROR: VPS_HOST is empty!"
            echo "👉 Please go to: https://github.com/Sports-Dev-07/chat-system/settings/secrets/actions"
            echo "👉 Add a Secret named: VPS_HOST with your Hostinger VPS IP."
            exit 1
          fi

          if [ -z "$VPS_KEY" ]; then
            echo "❌ CRITICAL ERROR: VPS_SSH_KEY is empty!"
            echo "👉 Please go to: https://github.com/Sports-Dev-07/chat-system/settings/secrets/actions"
            echo "👉 Add a Secret named: VPS_SSH_KEY with your private SSH key."
            exit 1
          fi

          echo "✅ Target Host: $VPS_HOST"
          echo "✅ Target User: $VPS_USER"
          echo "✅ Target Port: $VPS_PORT"

          # Setup local SSH directory & key on GitHub Actions runner
          mkdir -p ~/.ssh
          echo "$VPS_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add VPS to known hosts to prevent interactive authenticity prompts
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "🚀 Connecting to VPS via SSH..."
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            echo "📦 Logged into VPS successfully as $(whoami)!"

            # Locate repository
            if [ -d "$HOME/chat-system" ]; then
              cd "$HOME/chat-system"
            elif [ -d "$HOME/Chat-sysytem" ]; then
              cd "$HOME/Chat-sysytem"
            elif [ -d "$HOME/talkio" ]; then
              cd "$HOME/talkio"
            else
              echo "⚠️ Project folder not found in $HOME. Cloning repository..."
              cd "$HOME"
              git clone https://github.com/Sports-Dev-07/chat-system.git
              cd chat-system
            fi

            echo "📦 Pulling latest commits from main..."
            git fetch --all
            git reset --hard origin/main

            # Enter talkio directory
            cd talkio

            # Ensure .env exists
            if [ ! -f ".env" ]; then
              echo "⚙️ Creating production .env file..."
              cp .env.example .env
              sed -i "s/JWT_SECRET=change-me-in-production/JWT_SECRET=$(openssl rand -hex 32)/g" .env
              sed -i "s/DEV_MODE=true/DEV_MODE=false/g" .env
            fi

            # Deploy containers with Docker Compose
            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose build --pull
            docker compose up -d

            echo "⏳ Checking container status:"
            sleep 3
            docker compose ps
            echo "🎉 Deployment successful!"
          EOF

name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # Phase 1: Code Quality & Dependency Validation
  # ========================================================
  validate:
    name: Code & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r talkio/requirements.txt
          pip install flake8

      - name: Python Syntax & Lint Check
        run: |
          # Stop build on fatal syntax errors
          flake8 talkio/backend --count --select=E9,F63,F7,F82 --show-source --statistics

  # ========================================================
  # Phase 2: Automated Deployment to VPS via SSH
  # ========================================================
  deploy:
    name: Deploy to Production VPS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Production Deployment..."
            
            # Navigate to cloned repo in deploy user's home
            cd ~/Chat-sysytem || cd ~/Autonomus-Agent-bot || cd ~/talkio

            # Pull latest changes from main branch
            echo "📦 Pulling latest commits from GitHub..."
            git fetch --all
            git reset --hard origin/main

            # Enter talkio directory where docker-compose lives
            cd talkio

            # Create default .env if it does not exist yet
            if [ ! -f ".env" ]; then
              echo "⚙️ Creating production .env file..."
              cp .env.example .env
              # Generate random secure JWT secret
              sed -i "s/JWT_SECRET=change-me-in-production/JWT_SECRET=$(openssl rand -hex 32)/g" .env
              sed -i "s/DEV_MODE=true/DEV_MODE=false/g" .env
            fi

            # Rebuild and restart Docker containers with latest code
            echo "🐳 Rebuilding and starting Docker containers..."
            docker compose down --remove-orphans
            docker compose build --pull
            docker compose up -d

            # Output running container status
            echo "✅ Deployment complete! Checking container status:"
            docker compose ps
